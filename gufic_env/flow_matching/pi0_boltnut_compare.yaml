dataset:
  repo_id: gufic_boltnut_pi0
  root: /root/autodl-tmp/ur5_rg2_real_smolvla_dataset_force_plug
  revision: main

policy:
  type: pi0
  chunk_size: 10
  n_action_steps: 10
  device: cuda

  # 原始 PI0：不使用力
  effort_type: none
  effort_key: observation.force_torque
  effort_dim: 6
  effort_tokenizer: raw
  train_effort_proj: false
  train_force_code_embedder: false

  force_refine_enabled: false
  force_refine_split_step: 3
  force_refine_loss_weight: 0.0

  force_expert_enabled: false
  train_force_expert: false

  force_shared_attention_enabled: false
  train_force_shared_attention: false

  force_prediction_enabled: false
  force_prediction_loss_weight: 0.0
  force_prediction_expert_enabled: false
  train_force_prediction_expert: false

save_checkpoint: true
output_dir: /root/autodl-tmp/checkpoints_pi0_pluginsocket
batch_size: 16
job_name: pi0_boltnut
resume: false
seed: 42
num_workers: 2
steps: 40000
eval_freq: -1
log_freq: 50
save_freq: 5000
use_policy_training_preset: true

wandb:
  enable: false
  project: pi0_boltnut
  entity: ""
  disable_artifact: true