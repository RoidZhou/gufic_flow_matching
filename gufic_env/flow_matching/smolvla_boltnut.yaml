dataset:
  repo_id: gufic_boltnut_smolvla
  root: /root/autodl-tmp/ur5_rg2_real_smolvla_dataset_force_keyturning

policy:
  type: smolvla
  chunk_size: 80
  n_action_steps: 10
  effort_type: expert_his_c
  effort_key: observation.force_torque
  effort_dim: 6
  effort_tokenizer: raw
  force_vqvae_ckpt: /tmp/force_vqvae_200/force_vqvae_20260705_082414/latest.pt
  force_vqvae_window: 16
  train_force_code_embedder: true
  force_shared_attention_enabled: false   # 现在表示 T-Rex-style cached force continue
  force_refine_enabled: true
  force_expert_enabled: true
  train_force_expert: true
  force_refine_split_step: 6
  force_refine_loss_weight: 0.1  # 0.3
  force_prediction_enabled: true
  force_prediction_target_key: future.force_torque
  force_prediction_loss_weight: 0.2
  force_prediction_expert_enabled: true
  force_prediction_effort_type: expert_his_c

save_checkpoint: true
output_dir: /root/autodl-tmp/checkpoints_smolvla_hybrid_force_position_FR-VLA_keyturning_cs80_as10_frl.01
job_name: smolvla_boltnut
resume: false
seed: 42
batch_size: 16
num_workers: 2
steps: 50000
eval_freq: -1
log_freq: 50
save_freq: 5000
use_policy_training_preset: true

wandb:
  enable: false
  project: smolvla_boltnut
  entity: ""
  disable_artifact: true
